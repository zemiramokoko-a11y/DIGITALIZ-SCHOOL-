name: Generer un APK

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          sed -i 's/^name:.*/name: ecole_numerisee/' pubspec.yaml
          cat pubspec.yaml
          rm -rf android
          flutter create . --project-name ecole_numerisee --overwrite
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-ecole-numerisee
          path: build/app/outputs/flutter-apk/app-release.apk
